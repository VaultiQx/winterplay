<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winterplay — Early Access</title>
<meta name="description" content="Winterplay is coming soon. Leave your email and be first in line for new waitlists and mini games.">
<meta property="og:title" content="Winterplay — Early Access">
<meta property="og:description" content="Winterplay is coming soon. Leave your email and be first in line for new waitlists and mini games.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#FAF9F6; --ink:#0C0C0C; --body:#3A3A3A; --muted:#6B6B6B; --line:#E8E5DF;
    --accent:#C2185B; --accent-dark:#A8124B;
    --success:#2E9E7B; --success-soft:#E3F4EE;
    --err:#B42318; --err-bg:#FEF3F2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:17px; line-height:1.6;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
  }
  .wrap{max-width:960px;width:100%;margin:0 auto;padding:0 24px}
  @media (min-width:1024px){.wrap{padding:0 40px}}

  /* ---------- wordmark ---------- */
  header{padding:28px 0 0}
  .wordmark{display:inline-flex;align-items:center;gap:11px;text-decoration:none;
    font-weight:800;font-size:20px;letter-spacing:-.01em;color:var(--ink)}
  .wordmark .mark-img{width:40px;height:40px;display:block}

  /* ---------- centered capture ---------- */
  main{flex:1;display:flex;align-items:center}
  .capture{max-width:560px;margin:0 auto;padding:64px 0;text-align:center}
  h1{font-size:clamp(44px,7vw,64px);line-height:1.05;letter-spacing:-.02em;font-weight:800}
  .sub{color:var(--muted);font-size:18px;margin-top:16px}
  form{margin-top:36px}
  .row{display:flex;gap:12px}
  .row input{
    flex:1;min-width:0;min-height:56px;padding:13px 18px;font:inherit;font-size:16px;color:var(--ink);
    background:#fff;border:1.5px solid var(--line);border-radius:999px;
    transition:border-color .15s ease,box-shadow .15s ease}
  .row input::placeholder{color:#9A9AAC}
  .row input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(194,24,91,.12);outline:none}
  .row input.invalid{border-color:var(--err);background:var(--err-bg)}
  .row input:disabled{opacity:.6}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:13px 30px;
    border-radius:999px;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:16px;text-decoration:none;
    background:var(--accent);color:#fff;box-shadow:0 10px 24px rgba(194,24,91,.22);
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease,opacity .18s ease;white-space:nowrap}
  .btn:hover{background:var(--accent-dark);transform:translateY(-2px);box-shadow:0 14px 30px rgba(194,24,91,.28)}
  .btn:focus-visible{outline:3px solid rgba(194,24,91,.45);outline-offset:2px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .err-msg{display:none;font-size:14px;color:var(--err);margin-top:12px;font-weight:600}
  .err-msg.show{display:block}
  .spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid #E6C6D6;border-top-color:#fff;
    animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  .success{display:none}
  .success.show{display:block}
  .success .ok{width:68px;height:68px;margin:0 auto 18px;border-radius:50%;background:var(--success-soft);
    display:flex;align-items:center;justify-content:center}
  .success .ok svg{width:32px;height:32px}
  .success h2{font-size:26px;letter-spacing:-.01em;font-weight:800}
  .success p{color:var(--muted);margin-top:8px}
  .success .who{display:inline-block;margin-top:16px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:8px 16px;font-size:14.5px;font-weight:600}

  @media (max-width:560px){
    .row{flex-direction:column}
    .row .btn{width:100%}
    .capture{padding:48px 0}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
    .spinner{animation:none}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="wordmark" href="./" aria-label="Winterplay home"><img class="mark-img" src="assets/logo.svg" alt="Winterplay logo" width="40" height="40">Winterplay</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="capture">
      <h1>Early Access</h1>
      <p class="sub">Winterplay is coming soon. Leave your email and be first in line for new waitlists and mini games.</p>

      <form id="early-form" novalidate>
        <div class="row">
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" maxlength="100" required aria-label="Email address">
          <button class="btn" type="submit" id="submit-btn">Join</button>
        </div>
        <p class="err-msg" id="email-err">Enter a valid email address.</p>
      </form>

      <div class="success" id="success" role="status">
        <div class="ok" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32"><path fill="none" stroke="#15803D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M4 12.5 9.5 18 20 6.5"/></svg>
        </div>
        <h2>You&rsquo;re on the list</h2>
        <p>We&rsquo;ll email you when Winterplay opens.</p>
        <span class="who" id="success-email"></span>
      </div>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";

  /* ---------- form endpoint ----------
     Google Form "Winterplay Early Access" (created 2026-11-21).
     formId: the published e-ID from the form URL (the /formResponse POST only
     accepts this ID, not the API form ID). entryEmail: the web entry ID for
     the Email question, read from the published form's data-params and
     cross-checked against the Muse waitlist form's known IDs. The page POSTs
     to https://docs.google.com/forms/d/e/<formId>/formResponse with
     entry.<id> values. */
  var FORM_CONFIG = { formId: "1FAIpQLSdE8DQEnoLSAWJ-0oeXfxsnVApMhyfKsVksUoh1nE4oz1eLvg", entryEmail: "710411891" };

  var STORE = "winterplay-early-access";
  var form = document.getElementById("early-form");
  var input = document.getElementById("email");
  var err = document.getElementById("email-err");
  var submitBtn = document.getElementById("submit-btn");
  var successBox = document.getElementById("success");
  var successEmail = document.getElementById("success-email");

  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function showSuccess(email) {
    successEmail.textContent = email;
    form.style.display = "none";
    successBox.classList.add("show");
  }

  // Keep the success state after a refresh; the live record is the form.
  try {
    var saved = localStorage.getItem(STORE);
    if (saved) showSuccess(saved);
  } catch (e) { /* storage unavailable, form still works */ }

  input.addEventListener("input", function () {
    err.classList.remove("show");
    input.classList.remove("invalid");
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var email = input.value.trim();
    if (!EMAIL_RE.test(email)) {
      err.classList.add("show");
      input.classList.add("invalid");
      input.focus();
      return;
    }
    submitBtn.disabled = true;
    input.disabled = true;
    submitBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Joining...';

    function finish() {
      try { localStorage.setItem(STORE, email); } catch (err2) { /* storage unavailable */ }
      showSuccess(email);
    }

    var body = new URLSearchParams();
    body.append("entry." + FORM_CONFIG.entryEmail, email);
    fetch("https://docs.google.com/forms/d/e/" + FORM_CONFIG.formId + "/formResponse", {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    }).then(finish, finish);
  });
})();
</script>
</body>
</html>
